<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Loan Prediction App</h2>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Gender</label>
                <select id="gender" class="form-control">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Married</label>
                <select id="married" class="form-control">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Dependents</label>
                <input id="dependents" type="number" class="form-control" value="0">
            </div>

            <div class="col-md-6 mb-3">
                <label>Education</label>
                <select id="education" class="form-control">
                    <option value="Graduate">Graduate</option>
                    <option value="Not Graduate">Not Graduate</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Self Employed</label>
                <select id="self_employed" class="form-control">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Applicant Income</label>
                <input id="income" type="number" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Coapplicant Income</label>
                <input id="co_income" type="number" class="form-control" value="0">
            </div>

            <div class="col-md-6 mb-3">
                <label>Loan Amount</label>
                <input id="loan" type="number" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Loan Term (Years)</label>
                <input id="term" type="number" class="form-control" value="30">
            </div>

            <div class="col-md-6 mb-3">
                <label>Credit History</label>
                <select id="credit" class="form-control">
                    <option value="1">Good</option>
                    <option value="0">Bad</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Property Area</label>
                <select id="property" class="form-control">
                    <option value="Urban">Urban</option>
                    <option value="Rural">Rural</option>
                    <option value="Semiurban">Semiurban</option>
                </select>
            </div>

        </div>

        <!-- Predict Button -->
        <div class="text-center mt-3">
            <button onclick="predict()" class="btn btn-primary px-4">
                Predict
            </button>
        </div>

        <!-- Result -->
        <div class="text-center mt-4">
            <h3 id="result"></h3>

            <div class="progress mt-3" style="height: 25px;">
                <div id="progressBar" class="progress-bar" style="width: 0%">
                    0%
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ✅ FIXED SCRIPT PATH -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
